[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
# backend-path = ["."] # Removing backend-path; setuptools should be found via requires

[project]
name = "pyrush" # Renamed package
version = "0.1.0"
description = "A prototype Python package management tool with parallel capabilities, now named PyRush."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "requests>=2.20.0",
    "beautifulsoup4>=4.9.0"
    # "packaging>=20.0" # CRITICAL REVERT: Ensure packaging is not listed
]

